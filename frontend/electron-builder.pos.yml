appId: com.inventarioarens.pos
productName: Sistema de Inventario (POS)
executableName: Sistema-de-Inventario-POS
artifactName: Sistema-de-Inventario-POS-${version}.${ext}
asar: true
directories:
  output: release/pos
publish:
  provider: github
  owner: gamijoam
  repo: inventarioarens
  channel: pos
files:
  - electron/**/*
  - dist/pos/**/*
  - package.json
win:
  icon: build/icons/pos/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: false
  shortcutName: Sistema de Inventario (POS)
  uninstallDisplayName: Sistema de Inventario (POS)
  include: build/nsis/separate-install-dir.nsh
linux:
  icon: build/icons/pos
  target:
    - AppImage
  category: Office
