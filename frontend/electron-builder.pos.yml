appId: com.inventarioarens.pos
productName: Sistema de Inventario (POS)
executableName: Sistema-de-Inventario-POS
artifactName: Sistema-de-Inventario-POS-${version}.${ext}
asar: true
directories:
  output: release/pos
files:
  - electron/**/*
  - dist/admin/**/*
  - dist/pos/**/*
  - package.json
win:
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  shortcutName: Sistema de Inventario (POS)
  uninstallDisplayName: Sistema de Inventario (POS)
  include: build/nsis/separate-install-dir.nsh
linux:
  target:
    - AppImage
  category: Office
extraResources:
  - from: .electron-backend-stage-pos/backend
    to: backend
  - from: .electron-backend-stage-pos/runtime/php
    to: runtime/php
