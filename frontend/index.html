<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de Inventario y Punto de Venta" />
    <title>SDI · Sistema de Inventario</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('sdi-theme') || 'avilacar-retro';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'avilacar-dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg text-text-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
