appId: com.inventarioarens.admin
productName: Sistema de Inventario (Administrativo)
executableName: Sistema-de-Inventario-Administrativo
artifactName: Sistema-de-Inventario-Administrativo-${version}.${ext}
asar: true
directories:
  output: release/admin
files:
  - electron/**/*
  - dist/admin/**/*
  - dist/pos/**/*
  - package.json
win:
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  shortcutName: Sistema de Inventario (Administrativo)
  uninstallDisplayName: Sistema de Inventario (Administrativo)
  include: build/nsis/separate-install-dir.nsh
linux:
  target:
    - AppImage
  category: Office
extraResources:
  - from: .electron-backend-stage-admin/backend
    to: backend
  - from: .electron-backend-stage-admin/runtime/php
    to: runtime/php
