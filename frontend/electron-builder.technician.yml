appId: com.inventarioarens.technician
productName: Soporte Técnico
executableName: Soporte-Tecnico-Inventario
artifactName: Soporte-Tecnico-Inventario-${version}.${ext}
asar: true
directories:
  output: release/technician
publish:
  provider: github
  owner: gamijoam
  repo: inventarioarens
  channel: technician
files:
  - electron/**/*
  - dist/technician/**/*
  - package.json
win:
  icon: build/icons/technician/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: false
  shortcutName: Soporte Técnico
  uninstallDisplayName: Soporte Técnico
  include: build/nsis/separate-install-dir.nsh
linux:
  icon: build/icons/technician
  target:
    - AppImage
  category: Office
