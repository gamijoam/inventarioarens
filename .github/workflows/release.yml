name: Release Electron client

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Cliente a publicar'
        required: true
        default: 'technician'
        type: choice
        options:
          - technician
          - admin
          - pos
          - balanzapro-pos
          - balanzapro-admin
          - balanzapro-technician
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build + publish Electron client
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Resolve client
        id: client
        shell: bash
        run: |
          set -euo pipefail
          CLIENT="${{ github.event.inputs.client }}"
          if [ -z "$CLIENT" ]; then
            TAG_NAME="${GITHUB_REF_NAME:-}"
            # Los clientes con guion (balanzapro-pos) se resuelven primero para
            # no confundirlos con el sufijo simple (pos).
            for candidate in balanzapro-pos balanzapro-admin balanzapro-technician technician admin pos; do
              if [[ "$TAG_NAME" == *"-$candidate" ]]; then
                CLIENT="$candidate"
                break
              fi
            done
          fi
          case "$CLIENT" in
            admin|pos|technician|balanzapro-pos|balanzapro-admin|balanzapro-technician) ;;
            *) echo "No se pudo resolver un cliente valido desde '$GITHUB_REF_NAME'. Usa un tag v<version>-admin|pos|technician|balanzapro-pos|balanzapro-admin|balanzapro-technician."; exit 1 ;;
          esac
          echo "client=$CLIENT" >> "$GITHUB_OUTPUT"
          echo "CLIENT=$CLIENT" >> "$GITHUB_ENV"
          echo "Cliente: $CLIENT"

      - name: Build client
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:${CLIENT}
          # Build without publishing; the Motor Local has its own release workflow.
          # because electron-builder + GITHUB_TOKEN leaves drafts and can drop
          # the large installer.
          pnpm exec electron-builder --config electron-builder.${CLIENT}.yml --publish never
          node ../scripts/verify-electron-artifact.cjs "$CLIENT" "release/$CLIENT/win-unpacked"

      - name: Publish release
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}-${CLIENT}"
          YML="${CLIENT}.yml"
          echo "CLIENT=$CLIENT VERSION=$VERSION TAG=$TAG YML=$YML"

          test -f "release/${CLIENT}/${YML}" || { echo "Falta metadata de actualizacion: release/${CLIENT}/${YML}"; exit 1; }
          compgen -G "release/${CLIENT}/*.exe" > /dev/null || { echo "Falta instalador .exe para ${CLIENT}"; exit 1; }
          compgen -G "release/${CLIENT}/*.blockmap" > /dev/null || { echo "Falta blockmap para ${CLIENT}"; exit 1; }

          # Borra cualquier release/tag previo con el mismo nombre para re-publicar limpio.
          gh release delete "$TAG" --repo gamijoam/inventarioarens --yes --cleanup-tag 2>/dev/null || true

          gh release create "$TAG" \
            --repo gamijoam/inventarioarens \
            --title "$VERSION" \
            --generate-notes \
            release/${CLIENT}/*.exe \
            release/${CLIENT}/*.blockmap \
            release/${CLIENT}/${YML}
          echo "Publicado $TAG"
