name: Release Electron client

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Cliente a publicar'
        required: true
        default: 'technician'
        type: choice
        options:
          - technician
          - admin
          - pos
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build + publish Electron client
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, bcmath, gd, intl, zip, curl, xml, dom, fileinfo

      - name: Install composer deps
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Prepare PHP portable runtime
        working-directory: frontend
        run: pnpm run electron:prepare:php:linux

      - name: Build client
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          CLIENT="${{ github.event.inputs.client }}"
          if [ -z "$CLIENT" ]; then
            TAG_NAME="${GITHUB_REF_NAME:-}"
            case "$TAG_NAME" in
              v*-[a-z]*) CLIENT="${TAG_NAME##*-}" ;;
              *) echo "No se pudo inferir el cliente desde el tag '$TAG_NAME'. Usa un tag v<version>-admin|pos|technician."; exit 1 ;;
            esac
          fi
          case "$CLIENT" in
            admin|pos|technician) ;;
            *) echo "Cliente invalido: $CLIENT"; exit 1 ;;
          esac
          pnpm run build:${CLIENT}
          INVENTARIO_BACKEND_STAGE=.electron-backend-stage-${CLIENT} pnpm run electron:stage-backend
          # Build without publishing; the release is created explicitly below
          # because electron-builder + GITHUB_TOKEN leaves drafts and can drop
          # the large installer.
          pnpm exec electron-builder --config electron-builder.${CLIENT}.yml

      - name: Publish release
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          CLIENT="${{ github.event.inputs.client }}"
          if [ -z "$CLIENT" ]; then
            TAG_NAME="${GITHUB_REF_NAME:-}"
            case "$TAG_NAME" in
              v*-[a-z]*) CLIENT="${TAG_NAME##*-}" ;;
              *) echo "No se pudo inferir el cliente desde el tag '$TAG_NAME'. Usa un tag v<version>-admin|pos|technician."; exit 1 ;;
            esac
          fi
          case "$CLIENT" in
            admin|pos|technician) ;;
            *) echo "Cliente invalido: $CLIENT"; exit 1 ;;
          esac
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}-${CLIENT}"
          YML="${CLIENT}.yml"
          echo "CLIENT=$CLIENT VERSION=$VERSION TAG=$TAG YML=$YML"

          test -f "release/${CLIENT}/${YML}" || { echo "Falta metadata de actualizacion: release/${CLIENT}/${YML}"; exit 1; }
          compgen -G "release/${CLIENT}/*.exe" > /dev/null || { echo "Falta instalador .exe para ${CLIENT}"; exit 1; }
          compgen -G "release/${CLIENT}/*.blockmap" > /dev/null || { echo "Falta blockmap para ${CLIENT}"; exit 1; }

          # Borra cualquier release/tag previo con el mismo nombre para re-publicar limpio.
          gh release delete "$TAG" --repo gamijoam/inventarioarens --yes --cleanup-tag 2>/dev/null || true

          gh release create "$TAG" \
            --repo gamijoam/inventarioarens \
            --title "$VERSION" \
            --generate-notes \
            release/${CLIENT}/*.exe \
            release/${CLIENT}/*.blockmap \
            release/${CLIENT}/${YML}
          echo "Publicado $TAG"
