name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancela los jobs en curso si hay un push nuevo al mismo branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (Feature)
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:Y6TPKmU6yumlacirNxbeG5cCr4a1IHMJ4bVpFZRL588=
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: inventory_arens_testing
      DB_USERNAME: inventory_arens
      DB_PASSWORD: secret
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      MAIL_MAILER: log
      BROADCAST_CONNECTION: log
      BCRYPT_ROUNDS: 4
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: inventory_arens
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: inventory_arens_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, gd, intl, zip, curl, xml, dom, fileinfo, opcache
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Copy .env
        run: cp .env.example .env

      - name: Install composer deps
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Wait for postgres
        run: |
          for i in {1..30}; do
            if PGPASSWORD=secret psql -h 127.0.0.1 -p 5432 -U inventory_arens -d postgres -c '\q' 2>/dev/null; then
              echo "Postgres ready"
              exit 0
            fi
            echo "Waiting for postgres..."
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run phpunit
        run: vendor/bin/phpunit --testsuite Feature

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Run vitest
        working-directory: frontend
        run: pnpm test
