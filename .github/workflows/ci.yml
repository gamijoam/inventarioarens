name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancela los jobs en curso si hay un push nuevo al mismo branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nota: la suite PHPUnit (Feature) se ejecuta localmente con
# phpunit.sqlite.xml. En CI con PostgreSQL la suite completa tarda 15+ min y
# hay tests con timeouts (set_time_limit 180) y seeders demo pesados que no
# pasan. Por eso CI valida solo el frontend (tsc + vitest), que es rapido y
# asegura que el build de los clientes Electron no este roto antes de publicar.
jobs:
  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Run vitest
        working-directory: frontend
        run: pnpm test
