name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancela los jobs en curso si hay un push nuevo al mismo branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nota: la suite PHPUnit (Feature) se ejecuta localmente con
# phpunit.sqlite.xml. En CI con PostgreSQL la suite completa tarda 15+ min y
# hay tests con timeouts (set_time_limit 180) y seeders demo pesados que no
# pasan. Por eso CI valida el frontend (tsc + vitest) y los artifacts Electron
# por plataforma; la suite backend sigue ejecutandose localmente con SQLite.
jobs:
  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Run vitest
        working-directory: frontend
        run: pnpm test

  electron-linux:
    name: Electron Linux artifact (${{ matrix.client }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [admin, pos, technician]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        working-directory: frontend
        run: pnpm run build:${{ matrix.client }}

      - name: Package unpacked Linux client
        working-directory: frontend
        run: pnpm exec electron-builder --config electron-builder.${{ matrix.client }}.yml --linux dir --publish never

      - name: Verify packaged client
        working-directory: frontend
        run: node ../scripts/verify-electron-artifact.cjs ${{ matrix.client }} release/${{ matrix.client }}/linux-unpacked

  electron-windows:
    name: Electron Windows artifact (${{ matrix.client }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        client: [admin, pos, technician]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        working-directory: frontend
        run: pnpm run build:${{ matrix.client }}

      - name: Package unpacked Windows client
        working-directory: frontend
        run: pnpm exec electron-builder --config electron-builder.${{ matrix.client }}.yml --win dir --publish never

      - name: Verify packaged client
        working-directory: frontend
        run: node ../scripts/verify-electron-artifact.cjs ${{ matrix.client }} release/${{ matrix.client }}/win-unpacked

  balanzapro-windows-candidates:
    name: BalanzaPro Windows candidate (${{ matrix.client }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        client: [balanzapro-pos, balanzapro-admin, balanzapro-technician]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        working-directory: frontend
        run: pnpm run build:${{ matrix.client }}

      - name: Package Windows installer without publishing
        working-directory: frontend
        run: pnpm exec electron-builder --config electron-builder.${{ matrix.client }}.yml --win --publish never

      - name: Validate installer, update metadata and checksum
        shell: pwsh
        run: |
          $client = '${{ matrix.client }}'
          $output = "frontend/release/$client"
          $metadata = Join-Path $output "$client.yml"
          $installers = @(Get-ChildItem -LiteralPath $output -Filter '*.exe' -File)
          $blockmaps = @(Get-ChildItem -LiteralPath $output -Filter '*.blockmap' -File)
          if (-not (Test-Path -LiteralPath $metadata -PathType Leaf)) { throw "Missing update metadata: $metadata" }
          if ($installers.Count -ne 1) { throw "Expected one installer for $client; found $($installers.Count)." }
          if ($blockmaps.Count -ne 1) { throw "Expected one blockmap for $client; found $($blockmaps.Count)." }
          $sumFile = Join-Path $output 'SHA256SUMS'
          Remove-Item -LiteralPath $sumFile -Force -ErrorAction SilentlyContinue
          foreach ($file in @($metadata) + @($installers[0].FullName) + @($blockmaps[0].FullName)) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$(Split-Path -Leaf $file)" | Add-Content -LiteralPath $sumFile -Encoding ASCII
          }

      - name: Upload candidate for Windows acceptance testing
        uses: actions/upload-artifact@v4
        with:
          name: balanzapro-electron-${{ matrix.client }}
          path: |
            frontend/release/${{ matrix.client }}/*.exe
            frontend/release/${{ matrix.client }}/*.blockmap
            frontend/release/${{ matrix.client }}/*.yml
            frontend/release/${{ matrix.client }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  motor-frankenphp-config:
    name: FrankenPHP config migration
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test config migration and rollback backup
        shell: powershell
        run: .\scripts\tests\test-frankenphp-config-migration.ps1

  installer-publication-gate:
    name: All-in-one publication verification gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify missing hardware checks block publication
        run: bash scripts/tests/test-installer-publication-gate.sh
