name: Release Print Connector GUI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version del Conector de Impresion'
        required: true
        default: '0.2.0'
      prerelease:
        description: 'Publicar como release de prueba'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*-connector'

permissions:
  contents: write

jobs:
  publish:
    name: Build + publish Print Connector
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          if [ -z "$VERSION" ]; then
            TAG_NAME="${GITHUB_REF_NAME:-}"
            case "$TAG_NAME" in
              v*-connector)
                VERSION="${TAG_NAME#v}"
                VERSION="${VERSION%-connector}"
                ;;
              *)
                echo "No se pudo inferir la version desde '$TAG_NAME'. Usa v<version>-connector."
                exit 1
                ;;
            esac
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version invalida: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Set package version
        shell: bash
        env:
          CONNECTOR_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node -e "const fs=require('node:fs'); const file='tools/print-connector/package.json'; const pkg=JSON.parse(fs.readFileSync(file, 'utf8')); pkg.version=process.env.CONNECTOR_VERSION; fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\\n');"

      - name: Install connector dependencies
        working-directory: tools/print-connector
        run: pnpm install --frozen-lockfile

      - name: Run connector tests
        working-directory: tools/print-connector
        run: pnpm test

      - name: Build Electron GUI
        working-directory: tools/print-connector
        run: pnpm run build:gui:win

      - name: Validate Windows artifacts
        shell: powershell
        run: |
          $root = 'build\print-connector-gui'
          $portable = @(Get-ChildItem -LiteralPath $root -Filter '*-Portable-*.exe' -File)
          $setup = @(Get-ChildItem -LiteralPath $root -Filter '*-Setup-*.exe' -File)
          if ($portable.Count -ne 1) { throw "Se esperaba un portable y se encontraron $($portable.Count)." }
          if ($setup.Count -ne 1) { throw "Se esperaba un instalador y se encontraron $($setup.Count)." }
          if (-not (Test-Path -LiteralPath "$root\win-unpacked\resources\app.asar")) {
            throw 'Falta el app.asar del cliente Electron.'
          }
          foreach ($artifact in @($portable) + @($setup)) {
            $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($artifact.Name)" | Set-Content -LiteralPath "$($artifact.FullName).sha256" -Encoding ASCII
          }
          Get-ChildItem -LiteralPath $root -File | Select-Object Name, Length

      - name: Publish connector release
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          TAG="v${VERSION}-connector"
          RELEASE_FLAGS=(--repo gamijoam/inventarioarens --title "Print Connector ${VERSION}" --generate-notes)
          if [[ '${{ inputs.prerelease }}' == 'true' ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          # Keep the pushed tag attached to its commit when re-publishing a release.
          gh release delete "$TAG" --repo gamijoam/inventarioarens --yes 2>/dev/null || true
          gh release create "$TAG" \
            "${RELEASE_FLAGS[@]}" \
            build/print-connector-gui/*-Portable-*.exe \
            build/print-connector-gui/*-Portable-*.sha256 \
            build/print-connector-gui/*-Setup-*.exe \
            build/print-connector-gui/*-Setup-*.sha256
          echo "Publicado $TAG"
