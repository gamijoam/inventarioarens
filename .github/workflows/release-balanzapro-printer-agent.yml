name: Release BalanzaPro LAN Printer Agent

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version del agente local de impresion'
        required: true
        default: '1.0.1'
        type: string
      prerelease:
        description: 'Publicar como version candidata'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'printer-v*-balanzapro'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build + publish Windows printer agent
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          PRINTER_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:PRINTER_VERSION
          if (-not $version) {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^printer-v(\d+\.\d+\.\d+)-balanzapro$') {
              throw "No se pudo inferir la version desde la etiqueta: $tag"
            }
            $version = $Matches[1]
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version invalida: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/printer-agent/go.mod
          cache-dependency-path: tools/printer-agent/go.sum

      - name: Test printer agent
        working-directory: tools/printer-agent
        run: go test ./...

      - name: Build per-user Windows agent
        working-directory: tools/printer-agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags='-s -w -H=windowsgui' -o bin/BalanzaPro-Printer-Agent.exe ./cmd/printer-agent

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
            $candidateDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
            if (Test-Path (Join-Path $candidateDirectory 'makensis.exe')) {
              $env:Path += ";$candidateDirectory"
            }
          }
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) {
            throw 'No se encontro makensis.exe despues de instalar NSIS.'
          }
          $nsisDirectory = Split-Path -Parent $makensis.Source
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDirectory

      - name: Package and hash installers
        shell: pwsh
        env:
          PRINTER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:PRINTER_VERSION
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version invalida: $version"
          }
          $output = "BalanzaPro-Impresor-Setup-$version.exe"
          $agentExe = Join-Path $PWD.Path 'tools/printer-agent/bin/BalanzaPro-Printer-Agent.exe'
          if (-not (Test-Path -LiteralPath $agentExe -PathType Leaf)) {
            throw "No se encontro el agente compilado: $agentExe"
          }
          Push-Location tools/printer-agent/installer
          try {
            makensis.exe "/DVERSION=$version" "/DOUT_FILE=$output" "/DAGENT_EXE=$agentExe" installer-user.nsi
          } finally {
            Pop-Location
          }
          New-Item -ItemType Directory -Force -Path build/printer-agent | Out-Null
          Copy-Item tools/printer-agent/installer/$output build/printer-agent/$output
          Copy-Item tools/printer-agent/bin/BalanzaPro-Printer-Agent.exe build/printer-agent/
          Get-ChildItem build/printer-agent -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
          Get-ChildItem build/printer-agent -File | Select-Object Name, Length

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: printer-v${{ steps.version.outputs.version }}-balanzapro
          name: BalanzaPro Impresor Local ${{ steps.version.outputs.version }}
          prerelease: ${{ github.event_name == 'push' || inputs.prerelease }}
          make_latest: false
          generate_release_notes: true
          files: |
            build/printer-agent/BalanzaPro-Impresor-Setup-${{ steps.version.outputs.version }}.exe
            build/printer-agent/BalanzaPro-Impresor-Setup-${{ steps.version.outputs.version }}.exe.sha256
            build/printer-agent/BalanzaPro-Printer-Agent.exe
            build/printer-agent/BalanzaPro-Printer-Agent.exe.sha256
