name: Release Motor Local

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version independiente del Motor Local'
        required: true
        default: '0.1.0'
      prerelease:
        description: 'Publicar como release de prueba'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, bcmath, gd, intl, zip, curl, xml, dom, fileinfo

      - name: Install backend dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Motor Local
        shell: powershell
        run: .\scripts\build-local-motor.ps1 -Version '${{ inputs.version }}'

      - name: Validate artifact
        shell: powershell
        run: |
          $artifact = @(Get-ChildItem -LiteralPath build\local-motor\release -Filter '*.exe')
          if ($artifact.Count -ne 1) { throw "Se esperaba un instalador y se encontraron $($artifact.Count)." }
          $hash = (Get-FileHash -LiteralPath $artifact[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($artifact[0].Name)" | Set-Content -LiteralPath (Join-Path $artifact[0].DirectoryName "$($artifact[0].Name).sha256") -Encoding ASCII
          Get-Content -LiteralPath (Join-Path $artifact[0].DirectoryName "$($artifact[0].Name).sha256")

      - name: Publish Motor Local
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          TAG="motor-v${VERSION}"
          RELEASE_FLAGS=(--repo gamijoam/inventarioarens --title "Motor Local ${VERSION}" --generate-notes)
          if [[ '${{ inputs.prerelease }}' == 'true' ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release delete "$TAG" --repo gamijoam/inventarioarens --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "${RELEASE_FLAGS[@]}" \
            build/local-motor/release/*.exe \
            build/local-motor/release/*.sha256
