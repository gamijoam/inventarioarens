location = /mcp-admin/mcp {
    proxy_pass http://127.0.0.1:17890/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:17890;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location ^~ /mcp-admin/ {
    proxy_pass http://127.0.0.1:17890/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location = /.well-known/oauth-protected-resource/mcp-admin/mcp {
    proxy_pass http://127.0.0.1:17890/.well-known/oauth-protected-resource/mcp-admin/mcp;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# RFC 8414 path-inserted metadata URL for issuer https://app.balanzapro.com/mcp-admin.
# Exact match (no trailing slash) so nginx never issues a 301 to the internal :8086 port.
location = /.well-known/oauth-authorization-server/mcp-admin {
    proxy_pass http://127.0.0.1:17890/.well-known/oauth-authorization-server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/oauth-authorization-server/mcp-admin/ {
    proxy_pass http://127.0.0.1:17890/.well-known/oauth-authorization-server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# No OIDC here; return 404 instead of the SPA so MCP clients fall through cleanly.
location ^~ /.well-known/openid-configuration {
    return 404;
}
